{% extends 'base.html' %}
{% block content %}
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --light: #f3f4f6;
            --dark: #1f2937;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --hover-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f9fafb;
        }

        .update-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .main-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: var(--transition);
        }

        .main-card:hover {
            box-shadow: var(--hover-shadow);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary), #60a5fa);
            color: white;
            padding: 24px 32px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-body {
            padding: 32px;
        }

        /* 按钮组容器 - 水平一排核心样式 */
        .button-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .button-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* 统一按钮样式 */
        .btn-action {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            white-space: nowrap;
            min-width: 140px;
        }

        .btn-check {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);
        }

        .btn-check:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .btn-check:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-update {
            background-color: var(--success);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }

        .btn-update:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }

        .btn-update:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: var(--light);
            border-radius: var(--radius);
            padding: 20px;
            transition: var(--transition);
            border: 1px solid #e5e7eb;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow);
            border-color: #d1d5db;
        }

        .stat-label {
            font-size: 14px;
            color: var(--dark);
            opacity: 0.7;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .list-container {
            background-color: var(--light);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 32px;
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--dark);
            opacity: 0.6;
        }


        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>

    <div class="update-container">
        <div class="main-card">
            <!-- 卡片头部 -->
            <div class="card-header">
                <div class="header-title">
                    <i class="fas fa-sync-alt"></i>
                    悠久小说网数据更新中心
                </div>

                <div style="display: flex; align-items: center; gap: 10px; width: auto; margin-top: 5px">
                    <label for="site_select" style="margin: 0; white-space: nowrap;">更换爬取站点：</label>
                    <select id="site_select" class="form-control"
                            style="width: 180px; height: 32px; padding: 0 8px; font-size: 14px;"
                            onchange="jumpOtherSite(this.value)">
                        <option value="" disabled>--- 请选择小说源 ---</option>
                        <option value="1" {% if source_id == 1 %}selected{% endif %}>笔趣阁</option>
                        <option value="2" {% if source_id == 2 %}selected{% endif %}>悠久小说网</option>
                        <option value="3" {% if source_id == 3 %}selected{% endif %}>看书阁</option>
                    </select>
                </div>
            </div>

            <!-- 卡片内容 -->
            <div class="card-body">
                <!-- 操作按钮：水平一排布局 -->
                <div class="button-group">
                    <div class="button-left">
                        <button id="startCheck" class="btn-action btn-check">
                            <i class="fas fa-play"></i> 点击检查更新
                        </button>
                        <button id="novelImportBtn" class="btn-action btn-check">
                            <i class="fas fa-database"></i> 导入小说数据库
                        </button>
                        <button id="chapterImportBtn" class="btn-action btn-check" disabled>
                            <i class="fas fa-book-open"></i> 请优先导入数据库
                        </button>
                    </div>
                    <button id="startUpdate" class="btn-action btn-update" disabled>
                        暂无更新
                    </button>
                </div>

                <!-- 统计数据 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">
                            <i class="fas fa-book"></i> 总检查书籍
                        </div>
                        <div class="stat-value">{{ count }}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">
                            <i class="fas fa-arrow-up"></i> 需要更新
                        </div>
                        <div class="stat-value" id="needUpdate">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">
                            <i class="fas fa-tasks"></i> 运行状态
                        </div>
                        <div class="stat-value" id="checkStatus">等待操作</div>
                    </div>
                </div>

                <!-- 待更新列表 -->
                <div>
                    <div class="section-title">
                        <i class="fas fa-list-check"></i> 待更新小说 & 章节范围
                    </div>
                    <div class="list-container" id="updateList">
                        <div class="empty-state">
                            <i class="fas fa-folder-open fa-2x mb-2"></i>
                            <p>暂无更新数据</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% csrf_token %}
{% endblock %}

{% block js %}
    <script>
        $(function () {
            const $startBtn = $('#startCheck');
            const $needUpdate = $('#needUpdate');
            const $checkStatus = $('#checkStatus');
            const $updateList = $('#updateList');
            const $startUpdate = $('#startUpdate');
            let updateData = null
            // 开始检查更新
            $startBtn.click(function () {
                $needUpdate.text('0');
                if ($startBtn.is(':disabled')) return;

                $startBtn.prop('disabled', true).html(`
                    <i class="fas fa-spinner spinner"></i> 检查中...
                `);
                $checkStatus.text('检查更新中').css('color', 'var(--primary)');

                $updateList.html(`
                    <div class="empty-state">
                        <i class="fas fa-circle-notch spinner fa-2x mb-2"></i>
                        <p>正在检查更新...</p>
                    </div>
                `);

                $.get('/update/check_1/')
                    .done(function (res) {
                        if (res.code === 200) {
                            updateData = res.data;
                            const dataLen = res.data ? res.data.length : 0;
                            $needUpdate.text(dataLen);

                            if (dataLen > 0) {
                                $startUpdate.prop('disabled', false).html(`<i class="fas fa-play"></i> 开始更新`);
                                let listHtml = '';
                                res.data.forEach(item => {
                                    listHtml += `
                                        <div class="update-item">
                                            <div class="item-header">
                                                <div class="book-id">书籍 ID: ${item.book_id}</div>
                                                <div class="chapter-range">章节更新</div>
                                            </div>
                                            <div>范围: <strong>${item.start}</strong> → <strong>${item.end}</strong></div>
                                        </div>`;
                                });
                                $updateList.html(listHtml);
                                $checkStatus.text('待更新').css('color', 'var(--warning)');
                            } else {
                                $updateList.html(`
                                    <div class="empty-state">
                                        <i class="fas fa-check-circle fa-2x mb-2 text-success"></i>
                                        <p>暂无需要更新的小说</p>
                                    </div>`);
                                $checkStatus.text('已完成').css('color', 'var(--success)');
                            }
                        } else {
                            $checkStatus.text('失败').css('color', 'var(--danger)');
                        }
                    })
                    .fail(function () {
                        $checkStatus.text('失败').css('color', 'var(--danger)');
                    })
                    .always(function () {
                        $startBtn.prop('disabled', false).html(`<i class="fas fa-play"></i> 点击检查更新`);
                    });
            });

            // 开始执行更新
            $startUpdate.click(function () {
                if ($startUpdate.is(':disabled')) return;

                $startUpdate.prop('disabled', true).html(`<i class="fas fa-spinner spinner"></i> 更新中...`);
                $startBtn.prop('disabled', true).html(`更新中暂停使用`);
                $checkStatus.text('更新中').css('color', 'var(--primary)');
                $.ajax({
                    url: '/update_1/',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(updateData),
                    success: function (res) {
                        location.href = '/chapter_crawl_1/'
                    }
                });
            });
        });
        $('#novelImportBtn').click(function () {
            let $this = $(this);
            if ($this.is(':disabled')) return;
            $this.prop('disabled', true).html('<i class="fas fa-spinner spinner"></i> 导入中...');
            $.ajax({
                url: '/info_import/',
                type: 'get',
                success: function (res) {
                    alert(res.msg);
                    $this.prop('disabled', true).html('<i class="fas fa-check"></i> 导入完成')
                    $('#chapterImportBtn').prop('disabled', false).html('<i class="fas fa-book-open"></i> 导入章节数据库')
                    {#location.reload();#}
                },
                error: function (res) {
                    alert('导入失败');
                    $this.prop('disabled', false).html('<i class="fas fa-database"></i> 导入小说数据库');
                }
            })
        })
        $('#chapterImportBtn').click(function () {
            let $this = $(this);
            if ($this.is(':disabled')) return;
            $this.prop('disabled', true).html('<i class="fas fa-spinner spinner"></i> 导入中...');
            $.ajax({
                url: '/chapter_import/',
                type: 'get',
                success: function (res) {
                    alert(res.msg);
                    $this.prop('disabled', true).html('<i class="fas fa-check"></i> 导入完成')
                },
                error: function (res) {
                    alert('导入失败');
                    $this.prop('disabled', false).html('<i class="fas fa-book-open"></i> 导入章节数据库');
                }
            })
        })

        function jumpOtherSite(value) {
            if (!value) return;

            // 固定获取 CSRF（绝对不报错）
            const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

            // 站点配置
            let config = {};
            if (value === "1") {
                config = {
                    localSite: "笔趣阁",
                    info_crawl_page: "/info_crawl/",
                    chapter_crawl_page: "/chapter_crawl/",
                    update_page: "/update/page/"
                };
            } else if (value === "2") {
                config = {
                    localSite: "悠久小说网",
                    info_crawl_page: "/info_crawl_1/",
                    chapter_crawl_page: "/chapter_crawl_1/",
                    update_page: "/update/page_1/"
                };
            } else if (value === "3") {
                config = {
                    localSite: "看书阁",
                    info_crawl_page: "/info_crawl_2/",
                    chapter_crawl_page: "/chapter_crawl_2/",
                    update_page: "/update/page_2/"
                };
            }
            // 发送保存
            $.ajax({
                url: "/save_site_config/",
                type: "POST",
                data: {
                    localSite: config.localSite,
                    info_crawl_page: config.info_crawl_page,
                    chapter_crawl_page: config.chapter_crawl_page,
                    update_page: config.update_page,
                    csrfmiddlewaretoken: csrfToken
                },
                success: function (res) {
                    console.log("保存成功:", res);
                },
                complete: function () {
                    // 无论如何都跳转
                    location.href = config.update_page;
                }
            });
        }
    </script>
{% endblock %}
