{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrapv3/css/bootstrap.css' %}">
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "黑体", serif;
        }

        /* 渐变背景 */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        /* 注册卡片 */
        .box {
            width: 420px;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            margin: 0;
            border: none;
            transition: all 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        /* 卡片顶部装饰条 */
        .box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        /* 右上角登录按钮 */
        .btn-primary.btn-xs {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ffffff !important;
            color: #667eea !important;
            border: 1px solid #667eea !important;
            border-radius: 8px !important;
            padding: 8px 20px !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1) !important;
            transition: all 0.3s ease !important;
            float: none;
            margin: 0 !important;
            display: inline-block !important;
        }

        .btn-primary.btn-xs:hover {
            background: linear-gradient(90deg, #667eea, #764ba2) !important;
            color: #ffffff !important;
            border-color: transparent !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3) !important;
        }

        .btn-primary.btn-xs .glyphicon {
            margin-left: 5px;
            font-size: 12px;
        }

        /* 注册标题 */
        h2 {
            text-align: center;
            margin-bottom: 30px !important;
            position: relative;
            padding-top: 10px;
            font-size: 28px !important;
            color: #333 !important;
            font-weight: 600 !important;
            letter-spacing: 1px !important;
            font-family: "微软雅黑", "爱奇艺黑体 Medium", serif !important;
        }

        h2::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 10px auto 0;
            border-radius: 3px;
        }

        /* 表单组 - 核心定位容器 */
        .form-group {
            position: relative;
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        /* 输入框 - 重点调整内边距和高度 */
        .form-control {
            width: 100%;
            height: 45px; /* 固定高度 */
            padding: 0 15px 0 45px !important; /* 左侧留45px给图标，足够空间 */
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f9f9f9;
            transition: all 0.3s ease;
            line-height: 45px; /* 文字垂直居中 */
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background-color: #fff;
        }

        /* 图标 - 精准定位到输入框内左侧（核心修复） */
        .form-group .glyphicon {
            position: absolute;
            left: 18px; /* 图标左偏移，视觉居中 */
            top: calc(50% + 8px); /* 基于label+input的整体高度居中 */
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 18px; /* 图标放大，更醒目 */
            z-index: 99; /* 确保在输入框上层 */
            pointer-events: none;
        }

        /* 聚焦时图标变色 */
        .form-control:focus + .glyphicon {
            color: #667eea !important;
        }

        /* 错误提示 */
        .form-group span[style*="color:red"] {
            display: block;
            margin-top: 5px;
            font-size: 13px;
            color: #e74c3c !important;
        }

        #sp {
            display: block;
            text-align: center;
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            height: 20px;
            line-height: 20px;
        }

        /* 注册按钮 */
        .btn-primary[type="submit"] {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg, #667eea, #764ba2) !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            letter-spacing: 1px;
            transition: all 0.3s ease !important;
            margin: 0;
        }

        .btn-primary[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        /* 响应式 */
        @media (max-width: 450px) {
            .box {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
<div class="box">
    <a class="btn btn-primary btn-xs" href="/log/login/">
        登 录 <span class="glyphicon glyphicon-share-alt"></span>
    </a>
    <h2>注册</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.name == 'username' %}
                    <span class="glyphicon glyphicon-user"></span>
                {% elif field.name == 'password' %}
                    <span class="glyphicon glyphicon-lock"></span>
                {% elif field.name == 'again_password' %}
                    <span class="glyphicon glyphicon-lock"></span>
                {% endif %}
                <span style="color:red">{{ field.errors }}</span>
            </div>
        {% endfor %}
        <div>
            <input type="submit" class="btn btn-primary" value="确认注册">
        </div>
        <span id="sp">{{ error }}</span>
    </form>
</div>
</body>
</html>
