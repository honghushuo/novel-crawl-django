{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 小说阅读平台</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrapv3/css/bootstrap.css' %}">
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "黑体", serif;
        }

        /* 渐变背景 */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 登录卡片样式 */
        .login-box {
            width: 420px;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .login-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        /* 卡片顶部装饰 */
        .login-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        /* 标题样式 */
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding-top: 10px;
        }

        .login-title h2 {
            font-size: 28px;
            color: #333;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .login-title::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 10px auto 0;
            border-radius: 3px;
        }

        /* 注册按钮样式（优化版） */
        .register-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ffffff !important;
            color: #667eea !important;
            border: 1px solid #667eea !important;
            border-radius: 8px !important;
            padding: 8px 20px !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1) !important;
        }

        /* 注册按钮hover效果 */
        .register-btn:hover {
            background: linear-gradient(90deg, #667eea, #764ba2) !important;
            color: #ffffff !important;
            border-color: transparent !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3) !important;
        }

        /* 注册按钮图标样式（改用Bootstrap内置glyphicon） */
        .register-btn .glyphicon {
            margin-left: 5px;
            font-size: 12px;
        }

        /* 表单样式 */
        .login-form {
            opacity: 1;
            background-color: white;
            padding: 0;
            border-radius: 5px;
        }

        /* 输入框组样式（核心定位容器） */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        /* 输入框样式（优化内边距） */
        .form-control {
            width: 100%;
            height: 45px;
            padding: 0 15px 0 45px !important; /* 左侧留45px给图标 */
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
            line-height: 45px; /* 文字垂直居中 */
        }

        /* 输入框聚焦效果 */
        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background-color: #fff;
        }

        /* 输入框图标（Bootstrap glyphicon 精准定位） */
        .form-group .glyphicon {
            position: absolute;
            left: 18px; /* 图标水平居中 */
            top: calc(50% + 8px); /* 基于label+input整体高度居中 */
            transform: translateY(-50%);
            color: #a0aec0; /* 图标默认颜色 */
            font-size: 18px; /* 图标大小 */
            z-index: 99; /* 确保在输入框上层 */
            pointer-events: none; /* 防止点击图标影响输入 */
            transition: all 0.3s ease;
        }

        /* 输入框聚焦时图标变色 */
        .form-group .form-control:focus + .glyphicon {
            color: #667eea !important;
        }

        /* 错误提示样式 */
        .form-group span[style*="color:red"] {
            display: block;
            margin-top: 5px;
            font-size: 13px;
            color: #e74c3c !important;
        }

        #sp {
            display: block;
            text-align: center;
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            height: 20px;
            line-height: 20px;
        }

        /* 登录按钮样式 */
        .submit-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg, #667eea, #764ba2) !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            letter-spacing: 1px;
            transition: all 0.3s ease !important;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* 响应式适配 */
        @media (max-width: 450px) {
            .login-box {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-box">
    <!-- 注册按钮（改用glyphicon箭头图标） -->
    <a class="btn btn-primary register-btn" href="/register/">
        注 册 <span class="glyphicon glyphicon-arrow-right"></span>
    </a>

    <!-- 标题 -->
    <div class="login-title">
        <h2>用户登录</h2>
    </div>

    <!-- 登录表单（输入框改用glyphicon图标） -->
    <form class="login-form" method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.name == 'username' %}
                    <span class="glyphicon glyphicon-user"></span> <!-- 用户名图标 -->
                {% elif field.name == 'password' %}
                    <span class="glyphicon glyphicon-lock"></span>  <!-- 密码图标 -->
                {% endif %}
                <span style="color:red">{{ field.errors }}</span>
            </div>
        {% endfor %}

        <div>
            <input type="submit" class="btn btn-primary submit-btn" value="登 录">
        </div>
        <span id="sp">{{ error }}</span>
    </form>
</div>

<!-- 仅引入本地JS，无外部依赖 -->
<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'plugins/bootstrapv3/js/bootstrap.js' %}"></script>
</body>
</html>
